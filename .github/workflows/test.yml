name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Dual-engine byte equality (Node vs browser bundle)
        run: node test-web-engine.mjs
      - name: Differential crosscheck (independent algorithm path)
        run: node tools/test-crosscheck.mjs
      - name: Luck pillars
        run: node test-luck-pillars.mjs
      - name: Compatibility
        run: node test-compatibility.mjs
      - name: Favorable element
        run: node test-favorable-element.mjs
